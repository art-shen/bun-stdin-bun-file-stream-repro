name: repro

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check

  repro:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - bun-version: latest
            label: affected-latest-currently-1.3.13
            current-latest: 1.3.13
          - bun-version: 1.3.13
            label: affected-bun-1.3.13
            current-latest: 1.3.13
          - bun-version: 1.3.0
            label: affected-bun-1.3.0
          - bun-version: 1.2.23
            label: affected-bun-1.2.23
          - bun-version: 1.2.22
            label: affected-bun-1.2.22
          - bun-version: 1.2.21
            label: control-bun-1.2.21
          - bun-version: 1.2.20
            label: control-bun-1.2.20
          - bun-version: 1.2.10
            label: control-bun-1.2.10
          - bun-version: 1.2.5
            label: control-bun-1.2.5
          - bun-version: 1.2.1
            label: control-bun-1.2.1
          - bun-version: 1.1.0
            label: control-bun-1.1.0
          - bun-version: 1.0.0
            label: control-bun-1.0.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}
      - name: Record Bun version
        run: |
          echo "requested=${{ matrix.bun-version }}"
          echo "current_latest=${{ matrix.current-latest }}"
          echo "actual=$(bun --version)"
      - name: Reproduce against selected Bun
        run: bun run repro:assert-fixed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: repro-artifacts-${{ matrix.label }}
          path: artifacts
          if-no-files-found: error
